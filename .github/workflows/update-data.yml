name: Actualizar cotizaciones

# Solo consulta las APIs y escribe en Supabase.
# Ya no hace commit, ni build, ni deploy: la web lee los datos en vivo.
on:
  schedule:
    - cron: '0 8,13,18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Guardar cotizaciones en la base de datos
        run: node scripts/update-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
